appId: ${MAESTRO_APP_ID}
env:
  TASK_TITLE: ${TASK_TITLE}
  TASK_DESCRIPTION: ${TASK_DESCRIPTION}
  TASK_STATUS: ${TASK_STATUS}
  TASK_PRIORITY: ${TASK_PRIORITY}
  UPDATED_TASK_TITLE: ${UPDATED_TASK_TITLE}
  UPDATED_TASK_DESCRIPTION: ${UPDATED_TASK_DESCRIPTION}
  UPDATED_TASK_STATUS: ${UPDATED_TASK_STATUS}
  UPDATED_TASK_PRIORITY: ${UPDATED_TASK_PRIORITY}
---
# given
- runFlow:
    file: ../../interactions/steps/open-main-page.yaml

# when
- runFlow:
    file: ../../interactions/steps/open-edit-task-form.yaml
    env:
      TASK_TITLE: ${TASK_TITLE}
- runFlow:
    file: ../../interactions/steps/fill-edit-task-form.yaml
    env:
      UPDATED_TASK_TITLE: ${UPDATED_TASK_TITLE}
      UPDATED_TASK_DESCRIPTION: ${UPDATED_TASK_DESCRIPTION}
      UPDATED_TASK_STATUS: ${UPDATED_TASK_STATUS}
      UPDATED_TASK_PRIORITY: ${UPDATED_TASK_PRIORITY}
- runFlow:
    file: ../../interactions/steps/submit-edit-task-form.yaml
    env:
      UPDATED_TASK_TITLE: ${UPDATED_TASK_TITLE}
- runFlow:
    file: ../../interactions/steps/open-task-info-form.yaml
    env:
      TASK_TITLE: ${UPDATED_TASK_TITLE}

# then
- runFlow:
    file: ../../interactions/validators/task-info-data.yaml
    env:
      TASK_TITLE: ${UPDATED_TASK_TITLE}
      TASK_DESCRIPTION: ${UPDATED_TASK_DESCRIPTION}
      TASK_STATUS: ${UPDATED_TASK_STATUS}
      TASK_PRIORITY: ${UPDATED_TASK_PRIORITY}
