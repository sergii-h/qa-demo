name: Run accessibility tests (Cucumber Playwright — mocked BE)

on:
  workflow_call:

jobs:
  run-tests:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Start E2E environment
        uses: ./.github/actions/start-e2e-env
        with:
          app-mode: frontend
          docker-hub-username: ${{ secrets.DOCKER_HUB_USERNAME }}
          docker-hub-token: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Run Cucumber Playwright accessibility tests
        uses: ./.github/actions/cucumber-playwright-typescript-test
        with:
          npm-script: accessibility
          app-mode: frontend
          test-label: Run Cucumber Playwright accessibility tests (mocked BE)
          artifact-name: allure-results-cucumber-playwright-accessibility
