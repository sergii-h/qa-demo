name: E2E tests

on:
  pull_request:
    branches: [ "master" ]
    paths:
      - 'demo-interface/**'
      - 'demo-service/**'
      - 'e2e/playwright-typescript/**'
      - 'e2e/playwright-python/**'
      - 'e2e/selenide-junit5-selenium-grid/**'
      - 'e2e/cypress-javascript/**'
      - 'e2e/capybara-ruby/**'
      - 'docker/**'
      - '.github/workflows/e2e.yml'
      - '.github/workflows/playwright-typescript-e2e.yml'
      - '.github/workflows/playwright-typescript-uat.yml'
      - '.github/workflows/playwright-typescript-accessibility.yml'
      - '.github/workflows/playwright-python-e2e.yml'
      - '.github/workflows/playwright-python-uat.yml'
      - '.github/workflows/playwright-python-accessibility.yml'
      - '.github/workflows/selenide-junit5-grid-e2e.yml'
      - '.github/workflows/selenide-junit5-grid-uat.yml'
      - '.github/workflows/selenide-junit5-grid-accessibility.yml'
      - '.github/workflows/cypress-javascript-e2e.yml'
      - '.github/workflows/cypress-javascript-uat.yml'
      - '.github/workflows/cypress-javascript-accessibility.yml'
      - '.github/workflows/capybara-ruby-e2e.yml'
      - '.github/workflows/capybara-ruby-uat.yml'
      - '.github/workflows/capybara-ruby-accessibility.yml'
      - '.github/actions/audit-npm/**'
      - '.github/actions/audit-pip/**'
      - '.github/actions/audit-osv/**'
      - '.github/actions/start-e2e-env/**'
      - '.github/actions/playwright-typescript-test/**'
      - '.github/actions/playwright-python-test/**'
      - '.github/actions/selenide-test/**'
      - '.github/actions/cypress-javascript-test/**'
      - '.github/actions/capybara-ruby-test/**'
      - '.github/actions/merge-cypress-allure-shards/**'
  push:
    branches: [ "master" ]
    paths:
      - 'demo-interface/**'
      - 'demo-service/**'
      - 'e2e/playwright-typescript/**'
      - 'e2e/playwright-python/**'
      - 'e2e/selenide-junit5-selenium-grid/**'
      - 'e2e/cypress-javascript/**'
      - 'e2e/capybara-ruby/**'
      - 'docker/**'
      - '.github/workflows/e2e.yml'
      - '.github/workflows/playwright-typescript-e2e.yml'
      - '.github/workflows/playwright-typescript-uat.yml'
      - '.github/workflows/playwright-typescript-accessibility.yml'
      - '.github/workflows/playwright-python-e2e.yml'
      - '.github/workflows/playwright-python-uat.yml'
      - '.github/workflows/playwright-python-accessibility.yml'
      - '.github/workflows/selenide-junit5-grid-e2e.yml'
      - '.github/workflows/selenide-junit5-grid-uat.yml'
      - '.github/workflows/selenide-junit5-grid-accessibility.yml'
      - '.github/workflows/cypress-javascript-e2e.yml'
      - '.github/workflows/cypress-javascript-uat.yml'
      - '.github/workflows/cypress-javascript-accessibility.yml'
      - '.github/workflows/capybara-ruby-e2e.yml'
      - '.github/workflows/capybara-ruby-uat.yml'
      - '.github/workflows/capybara-ruby-accessibility.yml'
      - '.github/actions/audit-npm/**'
      - '.github/actions/audit-pip/**'
      - '.github/actions/audit-osv/**'
      - '.github/actions/start-e2e-env/**'
      - '.github/actions/playwright-typescript-test/**'
      - '.github/actions/playwright-python-test/**'
      - '.github/actions/selenide-test/**'
      - '.github/actions/cypress-javascript-test/**'
      - '.github/actions/capybara-ruby-test/**'
      - '.github/actions/merge-cypress-allure-shards/**'

permissions:
  contents: read
  actions: read

jobs:
  audit-e2e-dependencies:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/playwright-typescript/package-lock.json

      - name: Install Playwright TypeScript dependencies
        working-directory: e2e/playwright-typescript
        run: npm ci

      - name: Audit Playwright TypeScript dependencies
        uses: ./.github/actions/audit-npm
        with:
          working-directory: e2e/playwright-typescript

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-path: e2e/playwright-python/uv.lock

      - name: Install Playwright Python dependencies
        working-directory: e2e/playwright-python
        run: uv sync --frozen

      - name: Audit Playwright Python dependencies
        uses: ./.github/actions/audit-pip
        with:
          working-directory: e2e/playwright-python

      - name: Audit Selenide dependencies
        uses: ./.github/actions/audit-osv
        with:
          path: e2e/selenide-junit5-selenium-grid

      - name: Install Cypress JavaScript dependencies
        working-directory: e2e/cypress-javascript
        run: npm ci

      - name: Audit Cypress JavaScript dependencies
        uses: ./.github/actions/audit-npm
        with:
          working-directory: e2e/cypress-javascript

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: e2e/capybara-ruby

      - name: Install Capybara Ruby dependencies
        working-directory: e2e/capybara-ruby
        run: bundle install

      - name: Audit Capybara Ruby dependencies
        working-directory: e2e/capybara-ruby
        run: bundle exec bundler-audit check --update

  playwright-typescript-e2e:
    needs: audit-e2e-dependencies
    uses: ./.github/workflows/playwright-typescript-e2e.yml
    secrets: inherit

  playwright-typescript-uat:
    needs: audit-e2e-dependencies
    uses: ./.github/workflows/playwright-typescript-uat.yml
    secrets: inherit

  playwright-typescript-accessibility:
    needs: audit-e2e-dependencies
    uses: ./.github/workflows/playwright-typescript-accessibility.yml
    secrets: inherit

  playwright-python-e2e:
    needs: audit-e2e-dependencies
    uses: ./.github/workflows/playwright-python-e2e.yml
    secrets: inherit

  playwright-python-uat:
    needs: audit-e2e-dependencies
    uses: ./.github/workflows/playwright-python-uat.yml
    secrets: inherit

  playwright-python-accessibility:
    needs: audit-e2e-dependencies
    uses: ./.github/workflows/playwright-python-accessibility.yml
    secrets: inherit

  selenide-e2e:
    needs: audit-e2e-dependencies
    uses: ./.github/workflows/selenide-junit5-grid-e2e.yml
    secrets: inherit

  selenide-uat:
    needs: audit-e2e-dependencies
    uses: ./.github/workflows/selenide-junit5-grid-uat.yml
    secrets: inherit

  selenide-accessibility:
    needs: audit-e2e-dependencies
    uses: ./.github/workflows/selenide-junit5-grid-accessibility.yml
    secrets: inherit

  cypress-javascript-e2e:
    needs: audit-e2e-dependencies
    uses: ./.github/workflows/cypress-javascript-e2e.yml
    secrets: inherit

  cypress-javascript-uat:
    needs: audit-e2e-dependencies
    uses: ./.github/workflows/cypress-javascript-uat.yml
    secrets: inherit

  cypress-javascript-accessibility:
    needs: audit-e2e-dependencies
    uses: ./.github/workflows/cypress-javascript-accessibility.yml
    secrets: inherit

  capybara-ruby-e2e:
    needs: audit-e2e-dependencies
    uses: ./.github/workflows/capybara-ruby-e2e.yml
    secrets: inherit

  capybara-ruby-uat:
    needs: audit-e2e-dependencies
    uses: ./.github/workflows/capybara-ruby-uat.yml
    secrets: inherit

  capybara-ruby-accessibility:
    needs: audit-e2e-dependencies
    uses: ./.github/workflows/capybara-ruby-accessibility.yml
    secrets: inherit
