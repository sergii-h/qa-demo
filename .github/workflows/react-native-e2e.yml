name: React Native E2E tests

on:
  pull_request:
    branches: [master]
    paths:
      - 'demo-react-native/**'
      - 'demo-service/**'
      - 'docker/**'
      - 'e2e/maestro/**'
      - '.github/workflows/react-native-e2e.yml'
      - '.github/workflows/maestro-react-native-android-e2e.yml'
      - '.github/workflows/maestro-react-native-android-uat.yml'
      - '.github/workflows/maestro-react-native-android-accessibility.yml'
      - '.github/workflows/maestro-react-native-ios-e2e.yml'
      - '.github/workflows/maestro-react-native-ios-uat.yml'
      - '.github/workflows/maestro-react-native-ios-accessibility.yml'
      - '.github/actions/audit-npm/**'
      - '.github/actions/start-e2e-env/**'
      - '.github/actions/run-maestro-tests/**'
      - '.github/actions/run-maestro-ios-tests/**'
  push:
    branches: [master]
    paths:
      - 'demo-react-native/**'
      - 'demo-service/**'
      - 'docker/**'
      - 'e2e/maestro/**'
      - '.github/workflows/react-native-e2e.yml'
      - '.github/workflows/maestro-react-native-android-e2e.yml'
      - '.github/workflows/maestro-react-native-android-uat.yml'
      - '.github/workflows/maestro-react-native-android-accessibility.yml'
      - '.github/workflows/maestro-react-native-ios-e2e.yml'
      - '.github/workflows/maestro-react-native-ios-uat.yml'
      - '.github/workflows/maestro-react-native-ios-accessibility.yml'
      - '.github/actions/audit-npm/**'
      - '.github/actions/start-e2e-env/**'
      - '.github/actions/run-maestro-tests/**'
      - '.github/actions/run-maestro-ios-tests/**'

permissions:
  contents: read
  actions: read

jobs:
  audit-react-native-e2e-dependencies:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            demo-react-native/package-lock.json
            e2e/maestro/package-lock.json

      - name: Install demo-react-native dependencies
        working-directory: demo-react-native
        run: npm ci

      - name: Audit demo-react-native dependencies
        uses: ./.github/actions/audit-npm
        with:
          working-directory: demo-react-native

      - name: Install Maestro runner dependencies
        working-directory: e2e/maestro
        run: npm ci

      - name: Audit Maestro runner dependencies
        uses: ./.github/actions/audit-npm
        with:
          working-directory: e2e/maestro

  maestro-react-native-android-e2e:
    needs: audit-react-native-e2e-dependencies
    uses: ./.github/workflows/maestro-react-native-android-e2e.yml
    secrets: inherit

  maestro-react-native-android-uat:
    needs: audit-react-native-e2e-dependencies
    uses: ./.github/workflows/maestro-react-native-android-uat.yml
    secrets: inherit

  maestro-react-native-android-accessibility:
    needs: audit-react-native-e2e-dependencies
    uses: ./.github/workflows/maestro-react-native-android-accessibility.yml
    secrets: inherit

  maestro-react-native-ios-e2e:
    needs: audit-react-native-e2e-dependencies
    uses: ./.github/workflows/maestro-react-native-ios-e2e.yml
    secrets: inherit

  maestro-react-native-ios-uat:
    needs: audit-react-native-e2e-dependencies
    uses: ./.github/workflows/maestro-react-native-ios-uat.yml
    secrets: inherit

  maestro-react-native-ios-accessibility:
    needs: audit-react-native-e2e-dependencies
    uses: ./.github/workflows/maestro-react-native-ios-accessibility.yml
    secrets: inherit
