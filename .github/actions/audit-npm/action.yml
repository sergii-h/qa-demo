name: Audit npm dependencies
description: Fail when high or critical vulnerabilities are found in npm dependencies

inputs:
  working-directory:
    description: Directory containing package-lock.json (run npm ci first)
    required: true

runs:
  using: composite
  steps:
    - name: Audit npm dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # npm 10 uses the retired audits/quick API (5xx / 400 Invalid package tree).
      # scripts/dependabot-allowlist.json skips a high advisory only while that package has no non-breaking fix.
      run: |
        set -euo pipefail
        node "${GITHUB_WORKSPACE}/scripts/npm-audit-with-allowlist.mjs"
