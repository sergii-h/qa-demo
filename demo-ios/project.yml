name: Demo
options:
  bundleIdPrefix: com.example.demo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  ViewInspector:
    url: https://github.com/nalexn/ViewInspector
    from: 0.10.2
  PactSwift:
    url: https://github.com/surpher/PactSwift
    branch: main

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  Demo:
    type: application
    platform: iOS
    sources:
      - path: Demo
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.demo
        INFOPLIST_KEY_CFBundleDisplayName: QA Demo Tasks
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
        INFOPLIST_KEY_APIBaseURL: $(API_BASE_URL)
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        OTHER_LDFLAGS: "$(inherited) -ObjC"
    postCompileScripts: []

  DemoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DemoTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: Demo
      - package: ViewInspector
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.demo.tests
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_TESTING_SEARCH_PATHS: YES

  DemoPactTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DemoPactTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: Demo
      - package: PactSwift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.demo.pacttests
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_TESTING_SEARCH_PATHS: YES

  DemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DemoUITests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: Demo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.demo.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Demo:
    build:
      targets:
        Demo: all
        DemoTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - name: DemoTests
          parallelizable: false
        - name: DemoPactTests
          parallelizable: false
    run:
      config: Debug
    archive:
      config: Release

  DemoUITests:
    build:
      targets:
        Demo: all
        DemoUITests: [test]
    test:
      gatherCoverageData: false
      targets:
        - name: DemoUITests
          parallelizable: false
